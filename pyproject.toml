[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build/micropython", "build/pico-sdk", "vendor"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus import sorting and common bug patterns.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their public names (registries, run()).
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["firmware"]
