# TEST broker only: anonymous and open on the LAN. Never expose it.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Plaintext (the opt-in mode).
listener 1883
allow_anonymous true

# TLS (verified and unverified modes), with certificates from tools/picokit.py.
listener 8883
allow_anonymous true
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
